name: CI

# Tài liệu dự án nhiều lần khẳng định "đặt làm cổng CI, vượt thì fail build"
# trong khi repo chưa từng có CI nào. Đây là cổng thật.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Schema content collections là nơi đặt phần lớn ràng buộc về nội dung
      # và tuân thủ. Build hỏng nghĩa là một ràng buộc đã bị vi phạm.
      - name: Build
        run: npm run build

      # npx astro check tự cài thiếu dependency bằng prompt tương tác; trong CI
      # không có TTY nên nó thoát 0 mà không kiểm gì. Dùng script đã khai deps.
      - name: Kiểm tra kiểu
        run: npm run check

      - name: Ngân sách trọng lượng trang
        run: node scripts/check-budget.mjs

      # Nhánh gửi đơn khi ĐÃ cấu hình endpoint từng là nhánh chết suốt bốn vòng
      # kiểm định — không ai chạy nó. Nay nó là một phép thử bắt buộc.
      - name: Cài trình duyệt cho kiểm thử
        run: npx playwright install --with-deps chromium

      - name: Kiểm thử gửi đơn hàng
        run: PUBLIC_ORDER_ENDPOINT=http://localhost:8132/orders npm run build && npm run test:order
