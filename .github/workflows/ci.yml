name: CI

# Tài liệu dự án nhiều lần khẳng định "đặt làm cổng CI, vượt thì fail build"
# trong khi repo chưa từng có CI nào. Đây là cổng thật.
on:
  push:
    branches: ['**']
  pull_request:
  # Chạy hằng đêm để PHÁT HIỆN hạn ưu đãi đã qua. Lưu ý cho người sau: workflow
  # này KHÔNG deploy, và GitHub chỉ chạy schedule trên nhánh mặc định — nên nó
  # chỉ là chuông báo, không tự sửa trang production. Việc sửa thật sự là
  # Offer.astro tự ẩn dòng hạn và schema.ts không phát priceValidUntil quá hạn,
  # cả hai chỉ có hiệu lực sau một lần deploy mới.
  schedule:
    - cron: '0 1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastmod trong sitemap lấy từ ngày commit cuối của từng file nội dung.
          # checkout mặc định là shallow (depth 1) nên `git log -1 -- <file>` trả
          # về ngày commit HEAD cho MỌI file — đúng thứ nó sinh ra để tránh.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Schema content collections là nơi đặt phần lớn ràng buộc về nội dung
      # và tuân thủ. Build hỏng nghĩa là một ràng buộc đã bị vi phạm.
      - name: Build
        run: npm run build

      # npx astro check tự cài thiếu dependency bằng prompt tương tác; trong CI
      # không có TTY nên nó thoát 0 mà không kiểm gì. Dùng script đã khai deps.
      - name: Kiểm tra kiểu
        run: npm run check

      # Bộ thử hàng rào: mỗi ca là một cách phá mà kiểm định viên độc lập đã dùng
      # thành công. Chúng chạy trước build để lỗi hiện ra nhanh.
      - name: Bộ thử hàng rào nội dung
        run: npm run test:guards

      # Bảng trường sinh từ schema. Nếu schema đổi mà không chạy lại thì tài
      # liệu lệch khỏi mã — đúng thứ đã khiến người biên tập mất ba vòng thử.
      - name: Bảng trường khớp schema
        run: npm run docs:fields && git diff --exit-code docs/truong-du-lieu.md

      - name: Ngân sách trọng lượng trang
        run: node scripts/check-budget.mjs

      # Chuông báo hạn ưu đãi: fail để có người nhìn thấy, vì trang tĩnh đã
      # deploy sẽ tiếp tục hiển thị ưu đãi cũ cho tới lần deploy kế tiếp.
      - name: Hạn ưu đãi còn hiệu lực
        run: node scripts/check-offer-window.mjs

      # Nhánh gửi đơn khi ĐÃ cấu hình endpoint từng là nhánh chết suốt bốn vòng
      # kiểm định — không ai chạy nó. Nay nó là một phép thử bắt buộc.
      - name: Cài trình duyệt cho kiểm thử
        run: npx playwright install --with-deps chromium

      - name: Kiểm thử gửi đơn hàng
        run: PUBLIC_ORDER_ENDPOINT=http://localhost:8132/orders npm run build && npm run test:order

      # Bản build CÓ endpoint mới là bản giống production nhất. Đo ngân sách và
      # đối chiếu CSP trên chính nó — bản trước chỉ đo bản build không endpoint,
      # nên cổng CSP không bao giờ có gì để đối chiếu.
      - name: Ngân sách và CSP trên bản có endpoint
        run: PUBLIC_ORDER_ENDPOINT=https://mochatrinam.com/api/orders npm run build && node scripts/check-budget.mjs

      # Khẳng định cổng CSP FAIL ĐƯỢC. Kiểm định lần 11: bước trên truyền đúng
      # origin của site nên nhánh 'self' luôn đúng bất kể connect-src viết gì —
      # cổng dựng để chặn lỗi vòng 10 chưa từng nhận một đầu vào có thể làm nó
      # fail. Một cổng không bao giờ fail được thì không phải là cổng.
      - name: Cổng CSP phải chặn endpoint khác miền
        run: |
          PUBLIC_ORDER_ENDPOINT=https://api.khong-co-trong-csp.example/orders npm run build
          if node scripts/check-budget.mjs; then
            echo "LỖI: cổng CSP không chặn endpoint ngoài connect-src" >&2
            exit 1
          fi
          echo "ok: cổng CSP chặn đúng endpoint ngoài connect-src"
