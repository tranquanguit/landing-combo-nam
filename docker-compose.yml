# Triển khai trên Ubuntu:  cp .env.example .env  (điền giá trị)  &&  docker compose --profile https up -d --build
#
#   db     Postgres 17 — đơn hàng + nội dung + ảnh + tài khoản + chat (một volume, một pg_dump là đủ sao lưu)
#   app    website + /api/orders + /api/chat + /admin (nhập liệu, đơn hàng, chat, xuất bản)
#   caddy  HTTPS tự động (Let's Encrypt) cho SITE_DOMAIN, www.SITE_DOMAIN và ADMIN_HOST
#
# Các bước đưa lên máy chủ: docs/dua-len-production.md · vận hành: docs/trien-khai-docker.md

# Log của Docker mặc định không giới hạn — một đợt spam là đầy ổ đĩa. 10MB × 5 tệp mỗi dịch vụ.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: mocha
      POSTGRES_USER: mocha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocha -d mocha"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Không mở cổng Postgres ra ngoài: chỉ container app nói chuyện với nó.

  app:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://mochatrinam.com}
        PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
        PUBLIC_META_PIXEL_ID: ${PUBLIC_META_PIXEL_ID:-}
        PUBLIC_TIKTOK_PIXEL_ID: ${PUBLIC_TIKTOK_PIXEL_ID:-}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mocha:${POSTGRES_PASSWORD}@db:5432/mocha
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://mochatrinam.com}
      # Mã đo lường: đọc LÚC BUILD, nên phải có cả ở đây (nút Xuất bản build lại trong container)
      # lẫn ở build args phía trên. Trống = không gắn mã nào. Khách vẫn phải bấm đồng ý trước.
      PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
      PUBLIC_META_PIXEL_ID: ${PUBLIC_META_PIXEL_ID:-}
      PUBLIC_TIKTOK_PIXEL_ID: ${PUBLIC_TIKTOK_PIXEL_ID:-}
      ALLOWED_ORIGIN: ${PUBLIC_SITE_URL:-https://mochatrinam.com}
      # Tên miền con riêng cho trang quản trị (khuyên dùng). Trống = /admin chạy chung tên miền.
      ADMIN_HOST: ${ADMIN_HOST:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Đặt ADMIN_TOKEN (>= 24 ký tự) trong .env}
      IP_SALT: ${IP_SALT:?Đặt IP_SALT trong .env}
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      TRUST_PROXY: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      PUBLISH_ON_BOOT: ${PUBLISH_ON_BOOT:-1}
      # Chat: GIÁ TRỊ KHỞI ĐẦU — sau khi lưu ở /admin/settings/chat thì trang quản trị
      # được ưu tiên (đổi webhook/khoá/chế độ không cần sửa .env hay khởi động lại).
      # Không có webhook = trả lời bằng kịch bản tư vấn (/admin/chat-rules).
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET:-}
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-25000}
      CHAT_MODE: ${CHAT_MODE:-}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-90}
      CHAT_SESSION_RETENTION_DAYS: ${CHAT_SESSION_RETENTION_DAYS:-400}
    # Chỉ nghe trên localhost của máy chủ: đi ra Internet qua Caddy (hoặc nginx có sẵn).
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    logging: *logging
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-mochatrinam.com}
      # Chưa đặt ADMIN_HOST thì khối admin trong Caddyfile trỏ vào admin.localhost (vô hại).
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
